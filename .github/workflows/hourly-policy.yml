name: Apply hourly lesson policy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hourly-policy-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply versioned migration and rollback smoke test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-hourly-policy.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy administrator booking snapshot response
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-operations --project-ref ahhmaiazcimegsuihnrg
